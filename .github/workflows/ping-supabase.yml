name: Ping Supabase

on:
  schedule:
    # Todos os dias, 08:23 no horario de Brasilia (11:23 UTC)
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar a API do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PING_TOKEN: ${{ secrets.PING_TOKEN }}
        run: |
          resp=$(curl -sS --fail-with-body --retry 3 --retry-delay 15 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"p_token\":\"$PING_TOKEN\"}")
          echo "$resp"
          test "$resp" = '"ok"'
